    <title>Project Athena: Gallery</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">

    <link rel="stylesheet" href="assets/css/gallery.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Aldrich&display=swap"
        rel="stylesheet" />
    <meta name="author" content="Project Athena">
    <meta name="keywords" content="">
    <meta name="description" content="">
    <script src="https://kit.fontawesome.com/6f68c772bb.js" crossorigin="anonymous" defer></script>

    <script src="assets/js/site-wide.js" defer></script>
    <script src="assets/js/gallery.js" defer></script>
</head>

<body>

    <nav>
        <a id="nav-logo" href="index.html">
            <h2>Athena</h2>
            <h3>Aerospace</h3>
        </a>
        <div id="navigation">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a class="active-link" href="#gallery-top">Gallery</a></li>
                <li><a href="careers.html">Careers</a></li>
                <li><a href="contact.html">Contact</a></li>

            </ul>

        </div>
        <div id="mobile-nav-toggle" aria-label="Toggle Navigation Menu">
            <i class="fa-solid fa-bars"></i>
        </div>
    </nav>
    <div id="lightbox" class="hidden"></div>
    <header id="gallery-top">
        <div id="header-title">
            <h1>Our Past, Present & Future.</h1>
            <p>Explore the journey of Project Athena through our curated collection of images.</p>

        </div>
    </header>
    <main id="main-content-container">
        <section id="gallery-container">
            <h2 class="hidden">Athena Photo Gallery</h2>
            <figure class="image-container" tabindex="0">
                <img class="gallery-image" loading="lazy" src="assets/images/gallery/image-1.webp"
                    alt="An astronaut stands on the moons surface next to an American flag.">
                <button aria-label="Enlarge image" class="enlarge-image" data-src="assets/images/gallery/image-1.webp"
                    data-alt="An astronaut stands on the moons surface next to an American flag." tabindex="0"><i
                        class="fa-solid fa-magnifying-glass-plus"></i></button>
                <figcaption class="image-desc">Flight Commander Charlie Thomas on his first trip to the historical Moon
                    Landing
                    site. Footprints from the first expedition were still visible. </figcaption>
            </figure>
            <figure class="image-container" tabindex="0">
                <img class="gallery-image" loading="lazy" src="assets/images/gallery/image-2.webp"
                    alt="An astronaut stands on the moons featureless surface. ">
                <button aria-label="Enlarge image" class="enlarge-image" data-src="assets/images/gallery/image-2.webp"
                    data-alt="An astronaut stands on the moons featureless surface. "><i
                        class="fa-solid fa-magnifying-glass-plus"></i></button>

                <figcaption class="image-desc">A crew member of AX-9 reflects on the lunar terrain during an unscheduled
                    EVA
                    outside Shackleton Research Station.</figcaption>
            </figure>
            <figure class="image-container" tabindex="0">
                <img class="gallery-image" loading="lazy" src="assets/images/gallery/image-3.webp"
                    alt="The moons surface from a distance, showing some large and many small impact craters.">
                <button aria-label="Enlarge image" class="enlarge-image" data-src="assets/images/gallery/image-3.webp"
                    data-alt="The moons surface from a distance, showing some large and many small impact craters."><i
                        class="fa-solid fa-magnifying-glass-plus"></i></button>

                <figcaption class="image-desc">Reconnaissance imagery captured by the Athena-3 probe during site
                    selection
                    surveys for the proposed Artemis Forward Base.</figcaption>
            </figure>
            <figure class="image-container" tabindex="0">
                <img class="gallery-image" loading="lazy" src="assets/images/gallery/image-4.webp"
                    alt="An image of the earth taken through a window on the Athena Orbital Observation platform.">
                <button aria-label="Enlarge image" class="enlarge-image" data-src="assets/images/gallery/image-4.webp"
                    data-alt="An image of the earth taken through a window on the Athena Orbital Observation platform.">
                    <i class="fa-solid fa-magnifying-glass-plus"></i>
                </button>

                <figcaption class="image-desc">Earth observed through the Athena Orbital Platform's observation dome
                    during a
                    routine systems diagnostic, 400km above the Pacific.</figcaption>
            </figure>
            <figure class="image-container" tabindex="0">
                <img class="gallery-image" loading="lazy" src="assets/images/gallery/image-5.webp"
                    alt="An astronaut on the surface of the moon next to an american flag.">
                <button aria-label="Enlarge image" class="enlarge-image" data-src="assets/images/gallery/image-5.webp"
                    data-alt="An astronaut on the surface of the moon next to an american flag.">
                    <i class="fa-solid fa-magnifying-glass-plus"></i>
                </button>
                <figcaption class="image-desc">Mission Specialist Dr. Yuri Nakamura plants the Athena Aerospace flag at
                    the
                    Marius Hills outpost following the first crewed landing.</figcaption>
            </figure>
            <figure class="image-container" tabindex="0">
                <img class="gallery-image" loading="lazy" src="assets/images/gallery/image-6.webp"
                    alt="A long distance photograph of the Titan IV rocket ascending through earth's atmosphere.">
                <button aria-label="Enlarge image" class="enlarge-image" data-src="assets/images/gallery/image-6.webp"
                    data-alt="A long distance photograph of the Titan IV rocket ascending through earth's atmosphere.">
                    <i class="fa-solid fa-magnifying-glass-plus"></i>
                </button>
                <figcaption class="image-desc">The Athena Titan IV lifts off from Launch Complex 39 carrying the first
                    crew
                    rotation to the Athena Orbital Platform.</figcaption>
            </figure>
            <figure class="image-container" tabindex="0">
                <img class="gallery-image" loading="lazy" src="assets/images/gallery/image-7.webp"
                    alt="The surface of the moon, showing large imapct craters.">
                <button aria-label="Enlarge image" class="enlarge-image" data-src="assets/images/gallery/image-7.webp"
                    data-alt="The surface of the moon, showing large impact craters.">
                    <i class="fa-solid fa-magnifying-glass-plus"></i>
                </button>
                <figcaption class="image-desc">Taken onboard AX-9 minutes before touching down in Athena's first lunar
                    landing.
                    Impact craters and ancient lava tunnels can be seen near the landing site. </figcaption>
            </figure>
            <figure class="image-container" tabindex="0">
                <img class="gallery-image" loading="lazy" src="assets/images/gallery/image-8.webp"
                    alt="A space shuttle moments after launch, with large amounts of exhaust fumes. ">
                <button aria-label="Enlarge image" class="enlarge-image" data-src="assets/images/gallery/image-8.webp"
                    data-alt="A space shuttle moments after launch, with large amounts of exhaust fumes. ">
                    <i class="fa-solid fa-magnifying-glass-plus"></i>
                </button>
                <figcaption class="image-desc">Athena's first crewed flight test using the decomissioned NASA space
                    shuttle.
                </figcaption>
            </figure>
            <figure class="image-container" tabindex="0">
                <img class="gallery-image" loading="lazy" src="assets/images/gallery/image-9.webp"
                    alt="A researcher exploring caverns, using a light to study a wall. in the distance, the Milky Way can be seen in the sky. ">
                <button aria-label="Enlarge image" class="enlarge-image" data-src="assets/images/gallery/image-9.webp"
                    data-alt="A researcher exploring caverns, using a light to study a wall. in the distance, the Milky Way can be seen in the sky. ">
                    <i class="fa-solid fa-magnifying-glass-plus"></i>
                </button>
                <figcaption class="image-desc">Through the domed Athena Biohab, long exposures can pick out never before
                    seen
                    details of the solar system.</figcaption>
            </figure>
            <figure class="image-container" tabindex="0">
                <img class="gallery-image" loading="lazy" src="assets/images/gallery/image-10.webp"
                    alt="Top down survey imagery showing the moons surface, heavy scarred by impact craters. ">
                <button aria-label="Enlarge image" class="enlarge-image" data-src="assets/images/gallery/image-10.webp"
                    data-alt="Top down survey imagery showing the moons surface, heavy scarred by impact craters. ">
                    <i class="fa-solid fa-magnifying-glass-plus"></i>
                </button>
                <figcaption class="image-desc">Survey imagery during the initial pre launch planning stage, identifying
                    suitable landing sites for the Titan III.</figcaption>
            </figure>

        </section>
    </main>
   <footer>
        <div id="footer-content">
            <div id="social-links-holder">
                <a href="https://www.x.com" target="_blank" rel="noopener"><img id="x-logo" src="assets/images/social-logos/x-logo.svg" alt="X Logo"></a>
                <a href="https://www.instagram.com" target="_blank" rel="noopener"><img id="instagram-logo" src="assets/images/social-logos/instagram-logo.svg" alt="Instagram Logo"></a>
            </div>

                <ul>
                    <li><a href="careers.html">Careers</a></li>

                </ul>
            </div>
            <div id="copyright-holder">
                <p>©Athena Aerospace 2026</p>
